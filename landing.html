<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAFBFC" />
<meta name="description" content="Haabit — build habits, grow your persistence, unlock your world." />
<title>Haabit — Everyone starts on the first island.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;600;700&family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/landing.css" />
</head>
<body>

<nav class="topbar">
  <a class="wordmark" href="landing.html">Haabit</a>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">EN ⇄ فارسی</button>
</nav>

<!-- ===== Section A/B: the fogged map — the page itself is the pitch ===== -->
<header class="hero">
  <div class="world" id="heroWorld"><!-- islands built by js/landing.js --></div>
  <p class="hero-line" data-i18n="landingHeroLine">Everyone starts on the first island.</p>
</header>

<main>
  <!-- ===== Section C: interactive radar toy ===== -->
  <section class="sec sec-radar">
    <h2 class="sec-line" data-i18n="landingDrag">Drag the sliders. This is your week.</h2>
    <div class="radar-wrap">
      <div class="radar-stage">
        <canvas id="radarCanvas" role="img" aria-label="Balance radar"></canvas>
      </div>
      <div class="sliders" id="radarSliders"><!-- sliders built by js/landing.js --></div>
    </div>
  </section>

  <!-- ===== Section D: streak flame, live counter ===== -->
  <section class="sec sec-flame">
    <div class="flame-big" id="flameIcon" aria-hidden="true"></div>
    <div class="flame-count">
      <b id="flameNum">0</b>
      <span data-i18n="dayStreak">day streak</span>
    </div>
    <p class="flame-cap" id="flameCap">You've been here 0:00 — that's not a streak yet.</p>
  </section>

  <!-- ===== Section F: close / CTA ===== -->
  <section class="sec sec-cta">
    <div class="cta-island" id="ctaIsland" aria-hidden="true"></div>
    <a class="btn primary" id="ctaBtn" href="index.html" data-i18n="landingCta">Start the first island.</a>
    <p class="cta-date" id="dateChip"></p>
  </section>
</main>

<noscript><p style="text-align:center;padding:24px">Haabit's landing page needs JavaScript to render the map. The app itself lives at index.html.</p></noscript>

<script src="js/util.js"></script>
<script src="js/i18n.js"></script>
<script src="js/jalali.js"></script>
<script src="js/map.js"></script>
<script src="js/streaks.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
